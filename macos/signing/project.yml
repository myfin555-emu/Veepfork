# Xcode provisions the native macOS App ID and the shared iCloud container.
# Only its profile and resolved entitlements are used by the CMake-built app.
name: VeebSigning
options:
  deploymentTarget:
    macOS: "13.3"
targets:
  VeebSigning:
    type: application
    platform: macOS
    sources: [main.m]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vita3k.Vita3KIos
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Veeb.entitlements
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: Apple Development
    entitlements:
      path: Veeb.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.vita3k.Vita3KIos]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.dev.vita3k.Vita3KIos]
        com.apple.developer.icloud-services: [CloudDocuments]
schemes:
  VeebSigning:
    build:
      targets:
        VeebSigning: all
